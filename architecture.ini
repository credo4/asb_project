ASB-PROJECT/
├── CLAUDE.md                     # contexte global du monorepo (déjà là)
├── .gitignore                    # racine (node_modules, .env, dist…)
├── README.md                     # (optionnel) vue d'ensemble
│
├── backend/                      # API — NestJS + Prisma + MySQL
│   ├── prisma/
│   │   ├── schema.prisma         # ← déplacé ici depuis la racine
│   │   ├── migrations/           # généré par `prisma migrate`
│   │   └── seed.ts               # seed des taxonomies (piliers, formats…)
│   ├── src/
│   │   ├── main.ts               # bootstrap : ValidationPipe, helmet, CORS
│   │   ├── app.module.ts         # module racine
│   │   ├── prisma/               # PrismaModule + PrismaService (partagé)
│   │   ├── config/               # @nestjs/config
│   │   ├── common/               # TRANSVERSAL, réutilisé partout
│   │   │   ├── guards/           #   JwtAuthGuard, RolesGuard
│   │   │   ├── decorators/       #   @Roles(), @CurrentUser()
│   │   │   ├── filters/          #   filtre d'exception global
│   │   │   └── dto/              #   pagination, réponses communes
│   │   └── modules/              # DOMAINES MÉTIER
│   │       ├── auth/             #   login, refresh, vérif email, reset
│   │       ├── users/
│   │       ├── speakers/         #   CRUD admin des speakers
│   │       ├── taxonomies/       #   pillars, themes, formats, languages, countries
│   │       ├── booking-requests/ #   inbox des demandes clients
│   │       ├── roster-applications/
│   │       ├── activity-log/
│   │       └── public/           #   ⚠️ endpoints /public/* — frontière public/privé
│   ├── test/
│   ├── .env                      # NON versionné
│   ├── .env.example
│   ├── package.json              # la config `prisma.seed` vit ici
│   └── tsconfig.json
│
├── backoffice/                   # Admin — Vue 3 + Vite + Pinia
│   ├── src/
│   │   ├── router/               # routes protégées (rôles ADMIN/SUPER_ADMIN)
│   │   ├── stores/               # Pinia : auth, speakers, requests…
│   │   ├── api/                  # client HTTP (axios) vers le backend
│   │   ├── layouts/              # layout avec menu latéral
│   │   ├── views/                # Dashboard, Speakers, Demandes…
│   │   └── components/
│   ├── .env.example              # VITE_API_URL
│   └── package.json
│
└── speaker-portal/               # Espace speaker — Vue 3 + Vite + Pinia
    ├── src/
    │   ├── router/               # routes protégées (rôle SPEAKER)
    │   ├── stores/
    │   ├── api/
    │   ├── layouts/              # navigation réduite, mobile-first
    │   ├── views/                # Mon profil, Mes médias, Mes missions…
    │   └── components/
    ├── .env.example
    └── package.json